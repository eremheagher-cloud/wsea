
name: PC criado pelo @alves7.pcm

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: "Instance Number (1-10)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  deploy-rdp:
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 360

    steps:
      - name: Check Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = "$env:TEMP\tailscale-setup.exe"

          Invoke-WebRequest `
            -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' `
            -OutFile $installer

          $process = Start-Process `
            -FilePath $installer `
            -ArgumentList '/quiet' `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Tailscale installer failed: $($process.ExitCode)"
          }

          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (!(Test-Path $tailscale)) {
            throw "Tailscale executable not found after installation."
          }

          $service = Get-Service -Name Tailscale `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            throw "Tailscale service was not installed."
          }

          Write-Host "Tailscale installed successfully."

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Missing repository secret TAILSCALE_AUTH_KEY."
          }

          $service = Get-Service -Name Tailscale `
            -ErrorAction SilentlyContinue

          if ($null -eq $service) {
            throw "Tailscale service does not exist."
          }

          if ($service.Status -ne 'Running') {
            Start-Service -Name Tailscale
          }

          $serviceReady = $false

          for ($i = 1; $i -le 30; $i++) {
            Start-Sleep -Seconds 2
            $service = Get-Service -Name Tailscale

            if ($service.Status -eq 'Running') {
              $serviceReady = $true
              break
            }
          }

          if (!$serviceReady) {
            throw "Tailscale service failed to start."
          }

          Write-Host "Checking Tailscale backend..."

          $backendReady = $false

          for ($i = 1; $i -le 30; $i++) {
            $backendOutput = & $tailscale status --json 2>&1
            $backendExit = $LASTEXITCODE

            if ($backendExit -eq 0) {
              try {
                $backend = ($backendOutput -join "`n") |
                  ConvertFrom-Json

                if ($backend.BackendState -and
                    $backend.BackendState -ne 'NoState' -and
                    $backend.BackendState -ne 'NeedsLogin' -and
                    $backend.BackendState -ne 'Stopped') {
                  $backendReady = $true
                  break
                }
              }
              catch {
                Write-Host "Waiting for Tailscale backend initialization..."
              }
            }

            Start-Sleep -Seconds 2
          }

          if (!$backendReady) {
            Write-Host "Backend diagnostics:"
            & $tailscale status 2>&1 |
              ForEach-Object { Write-Host $_ }

            throw "Tailscale backend did not initialize. Check runner compatibility and the Tailscale service."
          }

          Write-Host "Authenticating with Tailscale..."

          & $tailscale up `
            "--auth-key=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=pc-rafael-${{ inputs.instance_number }}"

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale authentication failed. Check that the secret contains a valid Auth Key for the intended tailnet."
          }

          $ip = $null

          for ($i = 1; $i -le 60; $i++) {
            Start-Sleep -Seconds 2

            $ipOutput = & $tailscale ip -4 2>&1
            $ipExit = $LASTEXITCODE

            if ($ipExit -eq 0 -and $ipOutput) {
              $candidate = "$($ipOutput | Select-Object -First 1)".Trim()

              if ($candidate -match '^100\.\d{1,3}\.\d{1,3}\.\d{1,3}$') {
                $ip = $candidate
                break
              }
            }

            Write-Host "Waiting for Tailscale IP ($i/60)..."
          }

          if (!$ip) {
            Write-Host "Final Tailscale status:"
            & $tailscale status 2>&1 |
              ForEach-Object { Write-Host $_ }

            throw "No Tailscale IP received. Check authentication, device approval, network access, and runner compatibility."
          }

          "TAILSCALE_IP=$ip" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale connected successfully."

      - name: Configure Remote Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections `
            -Value 0

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'

          Write-Host "Remote Desktop configured."

      - name: Create Rafael Account
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $Username = 'Rafael'
          $Password = 'Wl7mX#2026@Pc!'

          $SecurePassword = ConvertTo-SecureString `
            $Password -AsPlainText -Force

          $User = Get-LocalUser -Name $Username `
            -ErrorAction SilentlyContinue

          if ($null -eq $User) {
            New-LocalUser `
              -Name $Username `
              -Password $SecurePassword `
              -Description 'Windows account Rafael' |
              Out-Null
          }
          else {
            Set-LocalUser `
              -Name $Username `
              -Password $SecurePassword
          }

          Enable-LocalUser -Name $Username

          $group = Get-LocalGroup -Name 'Remote Desktop Users'
          $member = Get-LocalGroupMember -Group $group `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -eq "$env:COMPUTERNAME\$Username" }

          if (!$member) {
            Add-LocalGroupMember `
              -Group $group `
              -Member $Username
          }

          Write-Host "Rafael account configured."

      - name: Test RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $listener = Get-NetTCPConnection `
            -State Listen `
            -LocalPort 3389 `
            -ErrorAction SilentlyContinue

          if ($listener) {
            Write-Host "RDP port 3389 is listening."
          }
          else {
            Write-Host "RDP port 3389 is not listening yet."
          }

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

      - name: Show Connection Details
        if: success()
        shell: pwsh
        run: |
          Write-Host "======= VIRTUAL PC DETAILS ======="
          Write-Host "Account: Rafael"
          Write-Host "Password: [use the password configured in Create Rafael Account]"
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          Write-Host "RDP port: 3389"
          Write-Host "=================================="

      - name: Keep Runner Active
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $endTime = (Get-Date).AddHours(5)

          while ((Get-Date) -lt $endTime) {
            Write-Host "Runner active: $(Get-Date -Format 'HH:mm:ss')"
            Start-Sleep -Seconds 60
          }

          Write-Host "Wait period completed."
          
